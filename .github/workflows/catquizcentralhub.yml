name: catquizcentralhub

# Own suite for the two central hub plugins.
#
# They carry their own code, their own settings and - since issue #65 - their own
# security boundary: the kill-switch that decides whether this instance may send data
# anywhere. Running their checks among a hundred other test files made them easy to
# overlook, and a security guard whose failure nobody notices is no guard.
#
# The two plugins live in their own repositories and are attached to local_catquiz as
# git submodules. A plain clone therefore yields two EMPTY directories: the paths
# exist, the code does not. Every job here fetches them from their own repositories
# instead - the same way the main workflow does - so that what is tested is what an
# installation actually gets.
#
# Deliberately not a copy of the main workflow: linting and unit tests are what these
# two need. Behat and Playwright belong to the plugin that owns the pages.

on:
  push:
    branches: [dev, develop, development, 'improve-*']
  pull_request:
  workflow_dispatch:

jobs:
  hub:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          # Submodules are deliberately NOT fetched. They would place a second copy of
          # each hub plugin inside local_catquiz, next to the one add-plugin installs
          # at its proper path - two copies of the same component in one tree.
          submodules: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mbstring, sodium, zip, gd, xmlrpc, soap, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> $GITHUB_PATH
          echo "$(cd ci/vendor/bin && pwd)" >> $GITHUB_PATH

      - name: Install Moodle, dependencies and both hub plugins
        run: |
          # local_catquiz declares hard dependencies, so the site cannot install with
          # the plugin alone.
          moodle-plugin-ci add-plugin --branch main Wunderbyte-GmbH/moodle-local_wunderbyte_table
          moodle-plugin-ci add-plugin --branch v-3.0 ralferlebach/moodle-mod_adaptivequiz
          moodle-plugin-ci add-plugin --branch master branchup/moodle-filter_shortcodes
          moodle-plugin-ci add-plugin --branch v-3.0 ralferlebach/moodle-adaptivequizcatmodel_catquiz

          # The plugins under test, from their own repositories rather than from the
          # submodule placeholders.
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_host
          moodle-plugin-ci add-plugin ralferlebach/moodle-catquizcentralhub_client

          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Locate both plugins
        id: locate
        run: |
          # add-plugin derives the install path from each plugin's own component name,
          # so it is read rather than assumed. An empty directory here would mean the
          # submodule placeholder was used instead of the repository - the very
          # situation this workflow exists to avoid, and one in which every check
          # below would pass by having nothing to examine.
          rc=0
          for part in host client; do
            path=$(find moodle -type d -path "*catquizcentralhub/$part" -not -path "*/plugin/*" | head -1)
            if [ -z "$path" ] || [ ! -f "$path/version.php" ]; then
              echo "catquizcentralhub_$part wurde nicht installiert oder ist leer"
              rc=1
              continue
            fi
            echo "${part}path=$path" >> $GITHUB_OUTPUT
            echo "gefunden: $path"
          done
          exit $rc

      - name: PHP lint
        run: |
          moodle-plugin-ci phplint "${{ steps.locate.outputs.hostpath }}"
          moodle-plugin-ci phplint "${{ steps.locate.outputs.clientpath }}"

      - name: Coding style
        run: |
          moodle-plugin-ci phpcs "${{ steps.locate.outputs.hostpath }}"
          moodle-plugin-ci phpcs "${{ steps.locate.outputs.clientpath }}"

      - name: PHPUnit
        run: |
          # A run that finds no test files exits zero and reports an empty suite as a
          # success, so both plugins are checked for having tests at all first.
          rc=0
          for path in "${{ steps.locate.outputs.hostpath }}" "${{ steps.locate.outputs.clientpath }}"; do
            count=$(find "$path" -name '*_test.php' | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "$path enthaelt keine Tests - eine leere Suite meldet faelschlich Erfolg."
              rc=1
              continue
            fi
            echo "--- $path ($count Testdateien)"
            moodle-plugin-ci phpunit "$path" || rc=1
          done
          exit $rc
